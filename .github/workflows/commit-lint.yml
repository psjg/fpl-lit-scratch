# Forge-side half of the commit-message gates (docs/COMMITS.md).
#
# .githooks/commit-msg only judges a commit in a clone whose hooks are wired, made by a
# tool that runs hooks. `git commit --no-verify`, an unwired clone and jj all get past it.
# This runs the same hook over every commit of the pull request, where it cannot be
# skipped. Mark the "commit-lint" check as required in the ruleset for main to make it a
# hard gate.
#
# The judge is the one on main, not the one the pull request carries: a pull request that
# edits .harness/scripts/commit-lint.sh, .harness/scripts/boundary.sh, .harness/scripts/leak-check.sh, .harness/scripts/branch-lint.sh or
# .githooks/commit-msg cannot loosen its own verdict. The anchor is main, not the PR base:
# the base of a stacked PR may itself hold unreviewed script edits. By design a PR that
# changes the gates is judged by the old gates; the owner reviews such PRs by hand.
#
# Refs and SHAs reach the script through environment variables, never through ${{ }}
# interpolation into the shell: a branch name is attacker-controlled text.
name: commit-lint

on:
  pull_request:
    # "edited" is how GitHub reports a retargeted base. Retargeting a stacked PR to main
    # makes its range larger without a new push, so it must be judged again. A title or
    # body edit re-runs the whole lint too: the job is deterministic and cheap, and a job
    # skipped by a condition is reported as success, so skipping would add a passing
    # check run on the head SHA of a PR whose lint failed.
    types: [opened, reopened, synchronize, edited]

# One run per pull request. Cancelling is safe because every event carries the current
# head and base, so the newest run judges the range that will be merged and an older run
# judges a range nobody will merge.
concurrency:
  group: commit-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit of the pull request passes the commit-msg gates
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The addresses agents commit as: the machine account of terminal sessions and
          # the Claude GitHub App (docs/COMMITS.md, sections 1 and 2).
          FPL_AGENT_EMAILS: >-
            326980220+psjg-claude@users.noreply.github.com
            41898282+claude[bot]@users.noreply.github.com
            336224473+psjg-codex@users.noreply.github.com
        run: |
          # A detached worktree of main shares the object store, so the PR commits resolve.
          git fetch --no-tags origin main
          git worktree add --detach "$RUNNER_TEMP/trusted" FETCH_HEAD
          cd "$RUNNER_TEMP/trusted"
          main_sha="$(git rev-parse HEAD)"
          # Lint only what this PR adds: not what its base holds, and not what main holds.
          # A stacked PR that merged newer main into its head would otherwise be judged on
          # commits that already landed. .harness/scripts/commit-lint.sh takes one range, so build a
          # throwaway commit with both as parents: "X..HEAD" then excludes the ancestors of
          # each. It is never referenced and dies with the runner.
          export GIT_AUTHOR_NAME=lint GIT_AUTHOR_EMAIL=lint@invalid
          export GIT_COMMITTER_NAME=lint GIT_COMMITTER_EMAIL=lint@invalid
          exclude="$(git commit-tree -m exclude -p "$BASE_SHA" -p "$main_sha" "$BASE_SHA^{tree}")"
          .harness/scripts/commit-lint.sh -b "$HEAD_REF" "$exclude..$HEAD_SHA"
