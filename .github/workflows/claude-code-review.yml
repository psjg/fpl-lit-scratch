name: Claude Code Review

# A review costs a model call; the two lint workflows cost seconds. So this one runs
# when there is something new to judge -- the pull request opened, reopened, or left
# draft -- and not on every push to the branch. Ask for a re-review by commenting
# @claude, which .github/workflows/claude.yml answers.
#
# The ruleset does not require a branch to be up to date with main (no strict policy),
# so "Update branch" is never needed to merge; pressing it only spends another run.
on:
  pull_request:
    types: [opened, ready_for_review, reopened]

# One run per pull request. A second push while a review is running cancels the first:
# the review of a commit that is no longer the head is worth nothing.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

