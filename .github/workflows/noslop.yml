# The noslop gate, where it cannot be skipped: on the pull request (docs/QUALITY.md).
#
# A branch that carries an implementation (a Makefile) runs `make check` on every push and
# `make ready` once the request is out of draft. A harness-only branch has no code to judge
# and runs `make gates` instead: the harness's own lint, its self-tests, and the proof that
# every check still refuses its bad example. Mark "noslop / check" as required in the ruleset
# for main to make it a hard gate.
#
# The dev shell comes from flake.nix, so the runner judges with the same tools at the same
# versions as a laptop. uv's download cache is kept between runs, keyed on the lock.
name: noslop

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

# One run per pull request; a new push cancels the run of the commit it replaces.
concurrency:
  group: noslop-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('.harness/quality/uv.lock') }}
      - name: The gate
        run: |
          if [ -f Makefile ]; then
            nix develop -c make check
          else
            nix develop -c make -f .harness/quality/noslop.mk gates
          fi

  ready:
    # The long search: minutes of CrossHair and mutation testing. Once per push to main,
    # and on a pull request only once it is out of draft.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('.harness/quality/uv.lock') }}
      - name: The long search
        run: |
          if [ -f Makefile ]; then
            nix develop -c make ready
          else
            nix develop -c make -f .harness/quality/noslop.mk gates
          fi
