# .harness/quality/pyproject.toml — the one Python environment of an implementation worktree.
#
# Not a package: a pinned set of the language's runtime stack (.agents/STACK.md) and of every
# tool the noslop gate runs (.agents/QUALITY.md). `make` in a worktree syncs it into that
# worktree's .venv with `uv sync --frozen`, so every attempt judges its code with the same
# tools at the same versions. It lives in the harness: changing a tool or a version is a policy
# change, a harness commit with [policy], never one that changes code.

[project]
name = "fpl-noslop"
version = "0"
requires-python = ">=3.12,<3.13"
dependencies = [
  # the implementation stack
  "lark==1.3.1",
  # the inner loop
  "ruff",
  "pytest",
  "pytest-xdist",
  "hypothesis",
  "icontract",
  # the full-screen interface, fpl tui (ADR-0006): its tests drive it headless
  "textual",
  "mypy",
  # coverage
  "coverage[toml]",
  # structure
  "import-linter",
  "deptry",
  "vulture",
  "pylint",
  "radon",
  # falsification
  "mutmut",
  "crosshair-tool",
  "hypothesis-crosshair",
  "pip-audit",
]

[tool.uv]
package = false
