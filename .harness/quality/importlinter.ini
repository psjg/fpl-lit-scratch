; .harness/quality/importlinter.ini — the layering of .agents/CONVENTIONS.md as checked contracts.
; source -> surface AST -> desugar -> core AST -> semantics; the arrows must not run back.

[importlinter]
root_package = fpl
include_external_packages = True

[importlinter:contract:parse-has-no-semantics]
name = parse.py holds no semantics: it knows the grammar and the surface AST, nothing after
type = forbidden
source_modules = fpl.parse
forbidden_modules =
    fpl.desugar
    fpl.ast_core
    fpl.eval
    fpl.types
    fpl.driver
allow_indirect_imports = False

[importlinter:contract:eval-sees-core-only]
name = eval.py and types.py only ever see the core AST
type = forbidden
source_modules =
    fpl.eval
    fpl.types
forbidden_modules =
    fpl.ast_surface
    fpl.parse
    fpl.desugar
    fpl.driver
    lark

[importlinter:contract:core-stands-alone]
name = the core AST depends on nothing but errors
type = forbidden
source_modules = fpl.ast_core
forbidden_modules =
    fpl.ast_surface
    fpl.parse
    fpl.desugar
    fpl.eval
    fpl.types
    fpl.driver
    lark

[importlinter:contract:driver-on-top]
name = only the entry points use the driver
type = forbidden
source_modules =
    fpl.errors
    fpl.parse
    fpl.ast_surface
    fpl.desugar
    fpl.ast_core
    fpl.eval
    fpl.types
forbidden_modules =
    fpl.driver
    fpl.__main__
    fpl.repl
