# .harness/quality/mypy.ini — the second type checker of every implementation worktree (.agents/QUALITY.md).
# pyright strict is the verifier of .agents/STACK.md; mypy judges the same code by the reference
# implementation of the typing PEPs, and the two disagree often enough to be worth both.
# Harness policy: changing it takes a harness commit with [policy], never one that changes code.

[mypy]
python_version = 3.12
strict = True
warn_unreachable = True
enable_error_code = ignore-without-code, possibly-undefined, redundant-expr, truthy-bool, truthy-iterable, unused-awaitable
# A waiver names its code and gives a reason (.harness/scripts/escapes): '# type: ignore[code] -- reason'.
show_error_codes = True
pretty = False
cache_dir = .noslop/mypy
