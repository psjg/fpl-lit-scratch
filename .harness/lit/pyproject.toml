# .harness/lit — Entangled, the tangler of the literate walker pages (01-bootstrap/01.0*/).
#
# Its own locked environment: entangled-cli needs Python 3.13 and the harness pins 3.12, so
# nothing of ours imports it. .harness/scripts/lit runs its CLI and reads its files.
# Prototype (okf-graph.lit-entangled): only the lex page is literate so far.

[project]
name = "fpl-lit"
version = "0"
description = "Entangled, pinned, for tangling the literate walker pages"
requires-python = ">=3.13,<3.14"
dependencies = ["entangled-cli==2.4.3"]

[tool.uv]
package = false
