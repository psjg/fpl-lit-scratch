# pyproject.toml — this attempt's project metadata and its mutation-testing scope.
# The tools and their versions are the harness's (.harness/quality/pyproject.toml, .harness/quality/uv.lock);
# changing this file is a policy change and takes [policy] (.agents/QUALITY.md).

[project]
name = "fpl"
version = "0"
requires-python = ">=3.12,<3.13"
dependencies = ["lark", "icontract", "click"]

[project.scripts]
fpl = "fpl.cli:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/fpl"]

# The REPL is still the seed's (01.01.06-cli): the seed travels in the wheel as fpl/_seed/fpl,
# where the CLI finds it once installed. It is data to the tangled package, never imported by it.
[tool.hatch.build.targets.wheel.force-include]
"fpl" = "fpl/_seed/fpl"

[tool.deptry]
known_first_party = ["fpl"]

[tool.deptry.per_rule_ignores]
# The tools come from the harness environment, not from this project's dependencies.
# nagini_contracts: fpl.advance, tangled from the Nagini page, imports it from .vendor/ and
# nothing declares it (TD-0015).
DEP001 = ["hypothesis", "pytest", "nagini_contracts"]
# click is used by the tangled python/ tree, which the deptry scan excludes.
DEP002 = ["click"]

[tool.mutmut]
source_paths = ["fpl/"]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-q"]
pytest_add_cli_args_test_selection = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "noslop_pytest"]
