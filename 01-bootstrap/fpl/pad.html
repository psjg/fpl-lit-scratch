<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FPL pad</title>
<link rel="stylesheet" href="pad.css">
</head>
<body>
<header>
	<b>FPL pad</b>
	<span>Shift+Enter evaluates · Enter newline · Tab indents · the buffer is the session: copy it, paste it into fpl repl</span>
	<button id="copy" type="button" title="the pad as text: paste it into fpl repl">copy</button>
	<button id="reset" type="button">reset</button>
	<span id="said" role="status"></span>
</header>
<main id="pad"></main>
<script type="module">
import {http, mount} from "./pad.js";
const said = document.getElementById("said");
const pad = await mount(http, document.getElementById("pad"), said);
document.getElementById("reset").addEventListener("click", pad.reset);
document.getElementById("copy").addEventListener("click", pad.copy);
</script>
</body>
</html>
