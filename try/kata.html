<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FPL Katas</title>
    <link rel="stylesheet" href="../assets/fpl-live.css" />
    <link rel="stylesheet" href="../assets/fpl-playground.css" />
  </head>
  <body data-fpl-page="kata" class="fpl-try fpl-try-app">
    <header class="fpl-try-header">
      <a class="fpl-try-brand" href="../index.html">FPL</a>
      <span class="fpl-try-title">Katas</span>
      <nav class="fpl-try-nav">
        <a href="index.html">Playground</a>
        <a class="active" href="kata.html">Katas</a>
        <a href="../werkbank/index.html">JupyterLite</a>
        <a href="../marimo/index.html">Marimo</a>
      </nav>
    </header>
    <main class="fpl-workspace fpl-workspace-kata">
      <aside class="fpl-pane fpl-pane-lesson" aria-label="Lesson">
        <div class="fpl-pane-bar">
          <span class="fpl-pane-label">Lesson</span>
        </div>
        <div class="fpl-lesson-body">
          <nav id="fpl-kata-list" class="fpl-kata-list"></nav>
          <div id="fpl-kata-prompt" class="fpl-kata-prompt"></div>
        </div>
      </aside>
      <div class="fpl-split" aria-hidden="true"></div>
      <section class="fpl-pane fpl-pane-work" aria-label="Editor and output">
        <div class="fpl-work-edit">
          <div class="fpl-pane-bar">
            <span class="fpl-pane-label">Edit</span>
            <div class="fpl-pane-actions">
              <button type="button" id="fpl-reset" class="fpl-btn">Reset</button>
              <button type="button" id="fpl-check" class="fpl-btn">Check</button>
              <button type="button" id="fpl-run" class="fpl-btn primary">Run</button>
            </div>
          </div>
          <textarea
            id="fpl-editor"
            class="fpl-editor"
            spellcheck="false"
            aria-label="Kata editor"
          ></textarea>
        </div>
        <div class="fpl-work-term">
          <div class="fpl-pane-bar">
            <span class="fpl-pane-label">Term</span>
          </div>
          <pre id="fpl-out" class="fpl-term" aria-live="polite"></pre>
        </div>
      </section>
    </main>
    <script type="module" src="../assets/fpl-playground.js"></script>
  </body>
</html>
